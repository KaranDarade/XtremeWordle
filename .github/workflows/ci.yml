name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The integration suite maps DATABASE_URL -> TEST_DATABASE_URL (src/test/setup.ts),
      # so both point at the ephemeral Postgres service below.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wordle_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wordle_test?schema=public
      SESSION_SECRET: ci-session-secret
      SEED_SECRET: ci-seed-secret
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wordle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run verify
